server.port=${PORT:8080}

# ─── MySQL Database (Railway & Environment Variables) ──────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://zephyr.proxy.rlwy.net:27558/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
